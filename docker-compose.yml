services:
  postgres:
    image: postgres:16-alpine
    container_name: backend-challenge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8.1
    container_name: backend-challenge-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-sqs:
    image: amazon/aws-cli:latest
    container_name: backend-challenge-init-sqs
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Creating FIFO queues on LocalStack SQS..."
        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name wager-transactions-dlq.fifo \
          --attributes FifoQueue=true
        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name wager-transactions.fifo \
          --attributes FifoQueue=true,ContentBasedDeduplication=false
        echo "Queues successfully created:"
        aws --endpoint-url=http://localstack:4566 sqs list-queues

  oidc-mock:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: backend-challenge-oidc-mock
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - 'JSON_CONFIG={"interactiveLogin":true,"httpServer":"NettyWrapper"}'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-challenge-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/wagering
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/wager-transactions.fifo
      - SQS_DLQ_URL=http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      - JWT_SECRET=jungle-gaming-super-secret-jwt-key-2026
      - JWKS_URI=http://oidc-mock:8080/default/jwks
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      init-sqs:
        condition: service_completed_successfully

volumes:
  postgres_data: